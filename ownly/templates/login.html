{% extends "base.html" %}
{% block title %}Log in · Ownly{% endblock %}
{% block main %}
<div class="auth">
  <h1>Log in to Ownly</h1>
  {% if error %}<p class="form-alert" role="alert">{{ error }}</p>{% endif %}
  <form method="post" class="auth-form" novalidate>
    <input type="hidden" name="csrf" value="{{ csrf_token() }}">
    <input type="hidden" name="next" value="{{ next }}">
    <div class="field">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="username" maxlength="254" value="{{ email }}" required>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" maxlength="128" required>
    </div>
    <button class="btn btn-block" type="submit">Log in</button>
  </form>
  <p class="auth-switch">New to Ownly? <a href="{{ url_for('auth.register', next=next or none) }}">Create an account</a></p>
</div>
{% endblock %}
